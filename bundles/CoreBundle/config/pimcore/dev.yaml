framework:
    router:
        strict_requirements: true
    profiler: { only_exceptions: false }

web_profiler:
    toolbar: true
    intercept_redirects: false

doctrine:
    dbal:
        connections:
            default:
                logging: true
                profiling: true

monolog:
    handlers:
        main:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%-debug.log"
            level: debug
            channels: ['!event', '!doctrine', '!cache']
        error:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%-error.log"
            level: error
            channels: [ '!event', '!doctrine', '!cache' ]
        console:
            type: console
            process_psr_3_messages: false
            channels: ['!event', '!doctrine', '!console', '!cache']

pimcore:
    web_profiler:
        toolbar:
            excluded_routes: ~

    translations:
        # enables support for the pimcore_debug_translations magic parameter
        # see doc/19_Development_Tools_and_Details/15_Magic_Parameters.md
        debugging:
            enabled: true
