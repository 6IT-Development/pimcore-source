services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            Pimcore\Maintenance\ExecutorInterface $maintenanceExecutor: '@Pimcore\Maintenance\Executor'
            Pimcore\Image\ImageOptimizerInterface $optimizer: '@Pimcore\Image\Optimizer'

    # tagged as messenger.message_handler by their #[AsMessageHandler] attribute
    Pimcore\Messenger\Handler\:
        resource: '../../../lib/Messenger/Handler/*Handler.php'
