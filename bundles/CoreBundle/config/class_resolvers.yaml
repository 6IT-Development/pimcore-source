services:
    _defaults:
        autowire: true
        autoconfigure: true

    pimcore.class.resolver.document:
        public: true
        class: Pimcore\Resolver\ClassResolver
        arguments:
            $map: '%pimcore.documents.classes.map%'

    pimcore.class.resolver.asset:
        public: true
        class: Pimcore\Resolver\ClassResolver
        arguments:
            $map: '%pimcore.assets.classes.map%'
